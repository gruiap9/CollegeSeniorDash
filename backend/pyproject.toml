[project]
name = "morningbrief"
version = "0.1.0"
description = "Local morning-brief backend: collects email, Canvas, course sites, Piazza, Gradescope and tech news into SQLite and builds a daily brief."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5",
  "python-dateutil>=2.9",
  "feedparser>=6",
  "anthropic>=1.0",
  "google-api-python-client>=2.100",
  "google-auth-oauthlib>=1.2",
  "msal>=1.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
morningbrief = "morningbrief.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["morningbrief*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
